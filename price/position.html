<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>商品期货 VaR 测算台</title>
<style>
:root{
  --bg:#f2efeb; --ink:#141311; --navy:#082D4F; --line:#d8d2c8;
  --risk:#B0322A; --muted:#7a746b; --panel:#faf8f4;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Helvetica Neue","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; line-height:1.55; padding:28px 20px 60px;
}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;
  border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
h1{font-size:22px;font-weight:700;letter-spacing:.02em;color:var(--navy)}
h1 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:10px}
.asof{font-size:12px;color:var(--muted);text-align:right}
.grid{display:grid;grid-template-columns:380px 1fr;gap:28px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
h2{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:.12em;text-transform:uppercase;
  margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2:first-child{margin-top:0}
.field{margin-bottom:12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
select,input[type=number]{width:100%;padding:8px 10px;font-size:14px;background:var(--panel);
  border:1px solid var(--line);color:var(--ink);border-radius:0;outline:none}
select:focus,input:focus{border-color:var(--navy)}
.dir-row{display:flex;border:1px solid var(--line)}
.dir-row button{flex:1;padding:8px 0;background:var(--panel);border:none;font-size:14px;cursor:pointer;color:var(--muted)}
.dir-row button.on-long{background:var(--risk);color:#fff}
.dir-row button.on-short{background:var(--navy);color:#fff}
.btn{display:inline-block;width:100%;padding:10px 0;background:var(--navy);color:#fff;border:none;
  font-size:14px;cursor:pointer;letter-spacing:.05em}
.btn:hover{background:#0c3d6b}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--ink);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:11px;padding:1px 6px;margin-right:6px}
.tag.long{background:#f6e3e1;color:var(--risk)}
.tag.short{background:#e2e9f0;color:var(--navy)}
.del{cursor:pointer;color:var(--muted);font-size:12px}
.del:hover{color:var(--risk)}
.settings{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:6px}
.settings .field{margin-bottom:0;min-width:150px}
.chips{display:flex;border:1px solid var(--line)}
.chips button{flex:1;padding:7px 12px;background:var(--panel);border:none;font-size:13px;cursor:pointer;color:var(--muted)}
.chips button.on{background:var(--ink);color:#fff}
.big{display:flex;gap:36px;flex-wrap:wrap;align-items:flex-end;margin:8px 0 4px}
.metric .k{font-size:12px;color:var(--muted)}
.metric .v{font-size:34px;font-weight:700;color:var(--risk);font-variant-numeric:tabular-nums;line-height:1.15}
.metric .v small{font-size:14px;font-weight:400;color:var(--muted);margin-left:4px}
.metric.sub .v{font-size:20px;color:var(--navy)}
.note{font-size:12px;color:var(--muted);margin-top:6px}
canvas{width:100%;height:230px;display:block}
.empty{padding:26px 10px;color:var(--muted);font-size:13px;border:1px dashed var(--line);text-align:center}
footer{margin-top:36px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7}
.bar-divers{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>商品期货 VaR 测算台<small>Value at Risk · 参数法 / 历史模拟法</small></h1>
  <div class="asof" id="asof"></div>
</header>

<div class="grid">
  <div>
    <h2>添加头寸</h2>
    <div class="field"><label>品种（主力连续合约）</label><select id="sym"></select></div>
    <div class="field"><label>方向</label>
      <div class="dir-row">
        <button id="dirL" class="on-long" type="button">买入 / 做多</button>
        <button id="dirS" type="button">卖出 / 做空</button>
      </div>
    </div>
    <div class="field"><label>手数</label><input type="number" id="lots" value="10" min="1" step="1"/></div>
    <button class="btn" id="add" type="button">加入组合</button>

    <h2>当前持仓</h2>
    <div id="posBox"><div class="empty">尚未添加头寸。选择品种、方向和手数后加入组合。</div></div>
  </div>

  <div>
    <h2>参数设置</h2>
    <div class="settings">
      <div class="field"><label>置信水平</label>
        <div class="chips" id="confChips">
          <button data-v="0.90">90%</button><button data-v="0.95" class="on">95%</button><button data-v="0.99">99%</button>
        </div></div>
      <div class="field"><label>持有期</label>
        <div class="chips" id="horChips">
          <button data-v="1" class="on">1 天</button><button data-v="5">5 天</button><button data-v="10">10 天</button>
        </div></div>
    </div>

    <div id="resultBox"><div class="empty">添加头寸后，这里会显示组合 VaR、ES（期望损失）与历史损益分布。</div></div>
  </div>
</div>

<footer>
口径说明：波动率与相关矩阵基于各品种主力连续合约近 <span id="nd"></span> 个交易日收盘价（数据截至 <span id="nd2"></span>）估算；历史模拟法逐日重估当前持仓的损益分布，参数法采用正态假设 + 品种间相关矩阵；多日持有期按 √T 缩放。结果为风险度量参考，不构成交易建议；连续涨跌停、限仓提保、流动性枯竭等极端情形不在模型覆盖范围内。
</footer>
</div>

<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const M = DATA.symbols, ORD = DATA.order, CORR = DATA.corr, PX = DATA.px;
const ND = DATA.n_days;
document.getElementById('asof').textContent = '数据截至 ' + DATA.asof + ' · 近 ' + ND + ' 个交易日';
document.getElementById('nd').textContent = ND;
document.getElementById('nd2').textContent = DATA.asof;

// ---- 品种下拉（按板块分组） ----
const cats = {};
ORD.forEach(s => { const m = M[s]; (cats[m.cat] = cats[m.cat] || []).push(s); });
const sel = document.getElementById('sym');
Object.keys(cats).forEach(c => {
  const g = document.createElement('optgroup'); g.label = c;
  cats[c].forEach(s => {
    const o = document.createElement('option'); o.value = s;
    o.textContent = `${M[s].name}（${s.replace('0','')}）· ¥${fmt0(M[s].price)} · 年化波动 ${M[s].vol_a}%`;
    g.appendChild(o);
  });
  sel.appendChild(g);
});

// ---- 状态 ----
let dir = 1, conf = 0.95, horizon = 1;
const positions = [];
document.getElementById('dirL').onclick = e => { dir = 1;  e.target.className='on-long';  document.getElementById('dirS').className=''; };
document.getElementById('dirS').onclick = e => { dir = -1; e.target.className='on-short'; document.getElementById('dirL').className=''; };
document.getElementById('confChips').onclick = e => { if(e.target.dataset.v){conf=+e.target.dataset.v; mark(e); calc();} };
document.getElementById('horChips').onclick = e => { if(e.target.dataset.v){horizon=+e.target.dataset.v; mark(e); calc();} };
function mark(e){ [...e.target.parentNode.children].forEach(b=>b.classList.remove('on')); e.target.classList.add('on'); }
document.getElementById('add').onclick = () => {
  const lots = Math.max(1, parseInt(document.getElementById('lots').value)||1);
  positions.push({sym: sel.value, dir, lots});
  render();
};

// ---- 工具 ----
function fmt0(x){ return x>=10000 ? x.toLocaleString('zh-CN',{maximumFractionDigits:0}) : x.toLocaleString('zh-CN'); }
function wan(x){ return (x/10000).toLocaleString('zh-CN',{maximumFractionDigits:1}) + ' 万'; }
function zScore(c){ return c===0.99?2.3263:(c===0.90?1.2816:1.6449); }
function pct(sortedArr, q){ const i = (sortedArr.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i);
  return sortedArr[lo] + (sortedArr[hi]-sortedArr[lo])*(i-lo); }

function render(){
  const box = document.getElementById('posBox');
  if(!positions.length){ box.innerHTML = '<div class="empty">尚未添加头寸。选择品种、方向和手数后加入组合。</div>'; }
  else {
    let rows = positions.map((p,i)=>{
      const m = M[p.sym], notional = p.lots*m.mult*m.price;
      return `<tr><td><span class="tag ${p.dir>0?'long':'short'}">${p.dir>0?'多':'空'}</span>${m.name}</td>
        <td>${p.lots}</td><td>${wan(notional)}</td>
        <td>${(m.vol_a).toFixed(1)}%</td>
        <td class="del" data-i="${i}">删除</td></tr>`;
    }).join('');
    box.innerHTML = `<table><tr><th>头寸</th><th>手数</th><th>名义价值</th><th>年化波动</th><th></th></tr>${rows}</table>`;
    box.querySelectorAll('.del').forEach(d=>d.onclick=()=>{positions.splice(+d.dataset.i,1);render();});
  }
  calc();
}

function calc(){
  const rb = document.getElementById('resultBox');
  if(!positions.length){ rb.innerHTML = '<div class="empty">添加头寸后，这里会显示组合 VaR、ES（期望损失）与历史损益分布。</div>'; return; }

  const z = zScore(conf), sqT = Math.sqrt(horizon);
  const idx = new Map(ORD.map((s,i)=>[s,i]));

  // 汇总同品种
  const agg = {};
  positions.forEach(p=>{ agg[p.sym]=(agg[p.sym]||0)+p.dir*p.lots; });
  const syms = Object.keys(agg);
  const n = syms.length;

  // ---- 参数法 ----
  const w = syms.map(s => agg[s]*M[s].mult*M[s].price*M[s].vol_d);   // 各品种每日盈亏 σ（元）
  let varSum = 0;
  const cw = new Array(n).fill(0);
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    const c = CORR[idx.get(syms[i])][idx.get(syms[j])];
    cw[i] += c*w[j]; varSum += w[i]*c*w[j];
  }
  const sigP = Math.sqrt(varSum);
  const varP = z*sigP*sqT;
  const undiv = z*w.reduce((a,b)=>a+Math.abs(b),0)*sqT;

  // ---- 历史模拟法 ----
  const pnl = new Array(ND).fill(0);
  syms.forEach(s=>{
    const px = PX[s], k = agg[s]*M[s].mult;
    for(let t=0;t<ND;t++) pnl[t] += k*(px[t+1]-px[t]);
  });
  const sorted = [...pnl].sort((a,b)=>a-b);
  const q = 1-conf;
  const varH1 = -Math.min(0, pct(sorted, q));
  const tail = sorted.filter(v=>v<=-varH1);
  const esH1 = tail.length ? -tail.reduce((a,b)=>a+b,0)/tail.length : varH1;
  const varH = varH1*sqT, esH = esH1*sqT;

  // ---- 逐头寸贡献（参数法 Euler 分解） ----
  const comp = syms.map((s,i)=> sigP>0 ? z*sqT*w[i]*cw[i]/sigP : 0);
  const rows = syms.map((s,i)=>{
    const m = M[s], lots = agg[s], notional = Math.abs(lots)*m.mult*m.price;
    const standalone = z*Math.abs(w[i])*sqT;
    return `<tr><td><span class="tag ${lots>0?'long':'short'}">${lots>0?'多':'空'}</span>${m.name}</td>
      <td>${Math.abs(lots)}</td><td>${wan(notional)}</td>
      <td>${wan(standalone)}</td>
      <td style="color:${comp[i]<0?'#1a7a4a':'inherit'}">${comp[i]<0?'−':'+'}${wan(Math.abs(comp[i]))}</td></tr>`;
  }).join('');

  const totalNotional = syms.reduce((a,s)=>a+Math.abs(agg[s])*M[s].mult*M[s].price,0);
  const divers = undiv>0 ? (1-varP/undiv)*100 : 0;

  rb.innerHTML = `
    <h2>组合风险（${(conf*100).toFixed(0)}% 置信 · ${horizon} 天持有期）</h2>
    <div class="big">
      <div class="metric"><div class="k">历史模拟 VaR</div><div class="v">${wan(varH)}<small>元</small></div></div>
      <div class="metric"><div class="k">ES 期望损失（尾部均值）</div><div class="v">${wan(esH)}<small>元</small></div></div>
      <div class="metric sub"><div class="k">参数法 VaR</div><div class="v">${wan(varP)}<small>元</small></div></div>
    </div>
    <div class="note">组合名义价值 ${wan(totalNotional)} · 历史模拟 VaR 占名义 ${(varH/totalNotional*100).toFixed(2)}% ·
      相关性分散效应 ${divers.toFixed(1)}%（不分散加总 ${wan(undiv)} → 参数法 ${wan(varP)}）</div>
    <h2>逐头寸 VaR</h2>
    <table><tr><th>头寸</th><th>净手数</th><th>名义价值</th><th>独立 VaR</th><th>对组合 VaR 贡献</th></tr>${rows}</table>
    <h2>历史损益分布（近 ${ND} 个交易日，逐日重估当前持仓）</h2>
    <canvas id="hist" width="900" height="230"></canvas>
    <div class="note">红线为历史模拟 VaR 分位点，红区为超过 VaR 的尾部样本（均值即 ES）。</div>`;
  drawHist(document.getElementById('hist'), pnl, varH1);
}

function drawHist(cv, pnl, varLine){
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth||cv.width, H = 230;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
  const bins = 36, mn = Math.min(...pnl), mx = Math.max(...pnl);
  const span = (mx-mn)||1, bw = span/bins;
  const cnt = new Array(bins).fill(0);
  pnl.forEach(v=>cnt[Math.min(bins-1, Math.floor((v-mn)/bw))]++);
  const cmax = Math.max(...cnt);
  const padL=8, padR=8, padT=12, padB=26, iw=W-padL-padR, ih=H-padT-padB;
  const X = v => padL + (v-mn)/span*iw;
  ctx.fillStyle='#082D4F';
  cnt.forEach((c,i)=>{
    const x0 = mn+i*bw, inTail = (x0+bw/2) <= -varLine;
    ctx.fillStyle = inTail ? '#B0322A' : 'rgba(8,45,79,.75)';
    const h = c/cmax*ih;
    ctx.fillRect(X(x0)+1, padT+ih-h, iw/bins-2, h);
  });
  ctx.strokeStyle='#B0322A'; ctx.setLineDash([5,4]); ctx.beginPath();
  const vx = X(-varLine); ctx.moveTo(vx,padT); ctx.lineTo(vx,padT+ih); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle='#d8d2c8'; ctx.beginPath(); ctx.moveTo(padL,padT+ih); ctx.lineTo(padL+iw,padT+ih); ctx.stroke();
  ctx.fillStyle='#7a746b'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  for(let i=0;i<=4;i++){ const v = mn+span*i/4; ctx.fillText(wan(v), X(v), H-8); }
}

render();
window.addEventListener('resize', ()=>calc());
</script>
